name: Build and deploy web edition

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "docs/book/book-manifest.json"
      - "docs/book/mermaid-config.json"
      - "docs/harness-survey/**"
      - "docs/web/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/book/book-manifest.json"
      - "docs/book/mermaid-config.json"
      - "docs/harness-survey/**"
      - "docs/web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10.1"

      - name: Run web unit tests
        run: |
          python3 -m unittest discover -s docs/web/tests -p 'test_*.py' -v
          python3 -m compileall -q docs/web
          bash -n docs/web/build.sh
          bash -n docs/web/serve.sh

      - name: Build and verify static site
        run: |
          docs/web/build.sh

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
